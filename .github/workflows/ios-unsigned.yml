name: Build unsigned iOS IPA

# Manual only: macOS runners bill at 10x against the free tier, so this must
# never run on every push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches identifiers nothing binds. Metro bundles those without
      # complaint and they only fail when the module is evaluated on device,
      # as a launch to a black screen with nothing logged.
      - name: Scope check
        run: npm run check

      # Generates the native ios/ project from app.json. Not committed (see
      # .gitignore), so it is regenerated on every run.
      - name: Expo prebuild
        run: npx expo prebuild --platform ios

      # Signing is switched off entirely: SideStore signs with your own Apple
      # ID when you install, so a signature here would only be stripped again.
      - name: Build unsigned .app
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          # The scheme is named after the workspace. Taking schemes[0] instead
          # picks a Pods scheme and builds only dependency frameworks.
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -list
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      # An .ipa is a zip with the .app inside Payload/.
      - name: Package into an .ipa
        run: |
          # Search rather than assume: the derived-data layout varies with the
          # Xcode version.
          APP=$(find ios/build -type d -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app produced. Contents of ios/build:"
            find ios/build -maxdepth 4 -type d | head -50
            exit 1
          fi
          echo "packaging $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PocketArcade-unsigned.ipa Payload
          ls -lh PocketArcade-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PocketArcade-unsigned-ipa
          path: PocketArcade-unsigned.ipa
          retention-days: 30
